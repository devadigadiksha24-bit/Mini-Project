name: IntelliPredict Automatic Retraining

on:
  push:
    branches:
      - main
    paths:
      - "data/raw/**"
      - "src/**"
      - "dvc.yaml"
      - "requirements.txt"

  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow

      - name: Install DVC
        run: |
          pip install dvc

      - name: Run DVC pipeline
        run: |
          python -m dvc repro

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t intellipredict-api:latest .

      - name: Show generated model
        run: |
          ls -lh models/
          ls -lh metrics.json
          ls -lh model_comparison.csv